apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.47.0
    helm:
      releaseName: prometheus
      values: |
        alertmanager:
          enabled: true
          persistence:
            storageClass: local-path-retain
          extraSecretMounts:
            - name: gmail-smtp
              mountPath: /etc/alertmanager/secrets
              secretName: alertmanager-smtp
              readOnly: true
          config:
            global:
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: asidor23+homelab@gmail.com
              smtp_auth_username: asidor23+homelab@gmail.com
              smtp_auth_identity: asidor23+homelab@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/smtp-auth-password
              smtp_require_tls: true
            route:
              receiver: gmail
              group_by: [alertname, instance]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: gmail
                email_configs:
                  - to: asidor23+homelab@gmail.com
                    send_resolved: true
        server:
          retention: 90d
          alertmanagers:
            - static_configs:
                - targets:
                    - prometheus-alertmanager.monitoring.svc.cluster.local:9093
          persistentVolume:
            enabled: true
            size: 10Gi
            storageClass: local-path-retain
          service:
            type: ClusterIP
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: homelab-operational
                rules:
                  - alert: NodeCPUUsageHigh
                    expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 75
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Node CPU usage is above 75%
                      description: CPU usage on {{ $labels.instance }} has been above 75% for 5 minutes.
                  - alert: NodeMemoryUsageHigh
                    expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 80
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Node memory usage is above 80%
                      description: Memory usage on {{ $labels.instance }} has been above 80% for 5 minutes.
                  - alert: LocalPathNodeStorageLow
                    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/", fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/", fstype="ext4"}) > 85
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Node storage is running low
                      description: A node filesystem used by local-path PVCs is more than 85% full. This is a node-level proxy, not per-PVC usage.
                  - alert: KubernetesDeploymentUnavailable
                    expr: kube_deployment_status_replicas_unavailable > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Kubernetes Deployment has unavailable replicas
                      description: At least one desired Deployment replica is unavailable.
                  - alert: KubernetesStatefulSetUnavailable
                    expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Kubernetes StatefulSet has unavailable replicas
                      description: The StatefulSet has fewer ready replicas than desired.
                  - alert: KubernetesDaemonSetUnavailable
                    expr: kube_daemonset_status_number_unavailable > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Kubernetes DaemonSet has unavailable pods
                      description: At least one desired DaemonSet pod is unavailable.
                  - alert: KubernetesPodPending
                    expr: kube_pod_status_phase{phase="Pending"} == 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Kubernetes pod has been Pending
                      description: A pod has remained Pending for at least 10 minutes.
                  - alert: VeleroBackupFailed
                    expr: increase(velero_backup_failure_total{namespace="velero"}[30m]) > 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: Velero backup failed
                      description: Velero recorded a backup failure in the last 30 minutes.
                  - alert: VeleroBackupStale
                    expr: time() - velero_backup_last_successful_timestamp{schedule="velero-daily"} > 3600
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: Velero scheduled backup is overdue
                      description: No successful scheduled Velero backup has completed in the last hour.
                  - alert: ArgoCDApplicationOutOfSync
                    expr: argocd_app_info{sync_status="OutOfSync"} == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Argo CD application is OutOfSync
                      description: An Argo CD application has remained OutOfSync for at least 5 minutes.
                  - alert: CertificateExpiresSoon
                    expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 30 * 24 * 60 * 60 and (certmanager_certificate_expiration_timestamp_seconds - time()) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Certificate expires within 30 days
                      description: A cert-manager certificate will expire in less than 30 days.
                  - alert: CertificateExpired
                    expr: certmanager_certificate_expiration_timestamp_seconds - time() <= 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: Certificate has expired
                      description: A cert-manager certificate has passed its expiration time.
        extraScrapeConfigs: |
          - job_name: argocd-applications
            scrape_interval: 30s
            static_configs:
              - targets:
                  - argocd-metrics.argocd.svc.cluster.local:8082
          - job_name: alertmanager
            scrape_interval: 30s
            static_configs:
              - targets:
                  - prometheus-alertmanager.monitoring.svc.cluster.local:9093
          - job_name: argo-rollouts
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - argo-rollouts
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: argo-rollouts-metrics
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true