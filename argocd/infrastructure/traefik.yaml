apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.2
    helm:
      values: |
        deployment:
          enabled: false
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik
        service:
          enabled: true
          spec:
            type: LoadBalancer
          annotations:
            metallb.io/address-pool: lan-pool
            metallb.io/loadBalancerIPs: 192.168.0.202
        extraObjects:
          - |
            apiVersion: v1
            kind: Service
            metadata:
              name: traefik-preview
              namespace: traefik
            spec:
              type: ClusterIP
              ports:
                - name: web
                  port: 80
                  targetPort: web
                - name: websecure
                  port: 443
                  targetPort: websecure
              selector:
                {{ include "traefik.labelselector" . | nindent 4 }}
          - |
            apiVersion: argoproj.io/v1alpha1
            kind: Rollout
            metadata:
              name: traefik
              namespace: traefik
            spec:
              replicas: 1
              selector:
                matchLabels:
                  {{ include "traefik.labelselector" . | nindent 6 }}
              template:{{ include "traefik.podTemplate" . | fromYaml | toYaml | nindent 4 }}
              strategy:
                blueGreen:
                  activeService: traefik
                  previewService: traefik-preview
                  autoPromotionEnabled: false
                  scaleDownDelaySeconds: 60
  ignoreDifferences:
    - group: ""
      kind: Service
      name: traefik
      namespace: traefik
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: traefik-preview
      namespace: traefik
      jsonPointers:
        - /spec/selector
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true