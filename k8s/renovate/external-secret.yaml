apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: renovate-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: homelab/secrets
        property: renovate-app-id
    - secretKey: installation-id
      remoteRef:
        key: homelab/secrets
        property: renovate-app-installation-id
    - secretKey: private-key
      remoteRef:
        key: homelab/secrets
        property: renovate-app-private-key