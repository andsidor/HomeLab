apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      values: |
        admin:
          existingSecret: grafana-admin-local
          userKey: admin-user
          passwordKey: admin-password
        service:
          type: LoadBalancer
          annotations:
            metallb.io/address-pool: lan-pool
            metallb.io/loadBalancerIPs: 192.168.0.200
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: true
              - name: Loki
                type: loki
                access: proxy
                url: http://loki-gateway.monitoring.svc.cluster.local
                jsonData:
                  maxLines: 1000
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                folder: ""
                type: file
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            zigbee:
              json: |
                {
                  "title": "Zigbee",
                  "uid": "zigbee",
                  "schemaVersion": 39,
                  "time": {"from": "now-24h", "to": "now"},
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1, "type": "timeseries", "title": "Temperatura",
                      "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "celsius"}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_temperature_celsius[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 2, "type": "timeseries", "title": "Wilgotność",
                      "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_humidity_percent[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 3, "type": "stat", "title": "Bateria",
                      "gridPos": {"h": 5, "w": 24, "x": 0, "y": 9},
                      "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_battery_percent[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    }
                  ]
                }
            zigbee3:
              json: |
                {
                  "title": "Zigbee3",
                  "uid": "zigbee3",
                  "schemaVersion": 39,
                  "time": {"from": "now-24h", "to": "now"},
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1,
                      "type": "timeseries",
                      "title": "Temperatura",
                      "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "celsius", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_temperature_celsius[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 2,
                      "type": "timeseries",
                      "title": "Wilgotność",
                      "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_humidity_percent[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 5,
                      "type": "stat",
                      "title": "Temperatura + trendy",
                      "gridPos": {"h": 5, "w": 12, "x": 0, "y": 9},
                      "fieldConfig": {"defaults": {"unit": "celsius", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}}, "overrides": []},
                      "targets": [{"expr": "zigbee_temperature_celsius", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 6,
                      "type": "stat",
                      "title": "Wilgotność + trendy",
                      "gridPos": {"h": 5, "w": 12, "x": 12, "y": 9},
                      "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}}, "overrides": []},
                      "targets": [{"expr": "zigbee_humidity_percent", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 4,
                      "type": "timeseries",
                      "title": "Jakość sygnału",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
                      "targets": [{"expr": "zigbee_linkquality", "legendFormat": "{{sensor}}", "refId": "A"}]
                    },
                    {
                      "id": 3,
                      "type": "stat",
                      "title": "Bateria",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
                      "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
                      "targets": [{"expr": "last_over_time(zigbee_battery_percent[30m])", "legendFormat": "{{sensor}}", "refId": "A"}]
                    }
                  ]
                }
            garmin:
              json: |
                {
                  "title": "Garmin",
                  "uid": "garmin",
                  "schemaVersion": 39,
                  "time": {"from": "now-7d", "to": "now"},
                  "refresh": "5m",
                  "panels": [
                    {
                      "id": 1, "type": "timeseries", "title": "Kroki",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                      "targets": [{"expr": "garmin_steps_total", "legendFormat": "kroki", "refId": "A"}]
                    },
                    {
                      "id": 2, "type": "timeseries", "title": "Tetno spoczynkowe",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
                      "targets": [{"expr": "garmin_resting_heart_rate_bpm", "legendFormat": "bpm", "refId": "A"}]
                    },
                    {
                      "id": 3, "type": "timeseries", "title": "Sen",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
                      "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                      "targets": [{"expr": "garmin_sleep_duration_seconds_total", "legendFormat": "sen", "refId": "A"}]
                    },
                    {
                      "id": 4, "type": "timeseries", "title": "Dystans",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
                      "fieldConfig": {"defaults": {"unit": "lengthm"}, "overrides": []},
                      "targets": [
                        {"expr": "garmin_distance_meters_total", "legendFormat": "dzienny", "refId": "A"},
                        {"expr": "garmin_activity_distance_meters_total", "legendFormat": "aktywnosci", "refId": "B"}
                      ]
                    },
                    {
                      "id": 5, "type": "timeseries", "title": "Kalorie",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
                      "targets": [
                        {"expr": "garmin_active_calories_total", "legendFormat": "aktywne", "refId": "A"},
                        {"expr": "garmin_activity_calories_total", "legendFormat": "aktywnosci", "refId": "B"}
                      ]
                    },
                    {
                      "id": 6, "type": "stat", "title": "Ostatnia synchronizacja",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
                      "fieldConfig": {"defaults": {"unit": "dateTimeFromNow"}, "overrides": []},
                      "targets": [{"expr": "garmin_sync_last_attempt_timestamp_seconds * 1000", "refId": "A"}]
                    }
                  ]
                }
            alerts:
              json: |
                {
                  "title": "Alerty",
                  "uid": "homelab-alerts",
                  "schemaVersion": 39,
                  "version": 1,
                  "time": {"from": "now-24h", "to": "now"},
                  "refresh": "30s",
                  "templating": {
                    "list": [
                      {
                        "name": "node",
                        "label": "Node",
                        "type": "query",
                        "definition": "label_values(node_cpu_seconds_total, instance)",
                        "query": {"query": "label_values(node_cpu_seconds_total, instance)", "refId": "Prometheus-node-Variable"},
                        "refresh": 1,
                        "multi": true,
                        "includeAll": true,
                        "allValue": ".*",
                        "current": {"selected": true, "text": "All", "value": "$__all"},
                        "options": []
                      }
                    ]
                  },
                  "panels": [
                    {
                      "id": 1,
                      "type": "stat",
                      "title": "Aktywne alerty w klastrze",
                      "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "sum(ALERTS{alertstate=\"firing\"}) or vector(0)", "refId": "A"}]
                    },
                    {
                      "id": 2,
                      "type": "stat",
                      "title": "Oczekujące alerty",
                      "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "sum(ALERTS{alertstate=\"pending\"}) or vector(0)", "refId": "A"}]
                    },
                    {
                      "id": 3,
                      "type": "stat",
                      "title": "Alertmanager scrape",
                      "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "up{job=\"alertmanager\"}", "refId": "A"}]
                    },
                    {
                      "id": 4,
                      "type": "stat",
                      "title": "Nieudane e-maile (24h)",
                      "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
                      "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "sum(increase(alertmanager_notifications_failed_total{integration=\"email\"}[24h])) or vector(0)", "refId": "A"}]
                    },
                    {
                      "id": 5,
                      "type": "table",
                      "title": "Aktywne alerty",
                      "gridPos": {"h": 9, "w": 24, "x": 0, "y": 5},
                      "targets": [{"expr": "ALERTS{alertstate=\"firing\"}", "format": "table", "instant": true, "refId": "A"}]
                    },
                    {
                      "id": 6,
                      "type": "timeseries",
                      "title": "CPU per node",
                      "gridPos": {"h": 9, "w": 12, "x": 0, "y": 14},
                      "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 75}]}}, "overrides": []},
                      "targets": [{"expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\", instance=~\"$node\"}[5m])))", "legendFormat": "{{instance}}", "refId": "A"}]
                    },
                    {
                      "id": 9,
                      "type": "timeseries",
                      "title": "RAM per node",
                      "gridPos": {"h": 9, "w": 12, "x": 12, "y": 14},
                      "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}}, "overrides": []},
                      "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"})", "legendFormat": "{{instance}}", "refId": "A"}]
                    },
                    {
                      "id": 7,
                      "type": "timeseries",
                      "title": "Wysyłka powiadomień e-mail",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 23},
                      "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
                      "targets": [
                        {"expr": "sum by (receiver) (rate(alertmanager_notifications_total{integration=\"email\"}[5m]))", "legendFormat": "wysłane {{receiver}}", "refId": "A"},
                        {"expr": "sum by (receiver) (rate(alertmanager_notifications_failed_total{integration=\"email\"}[5m]))", "legendFormat": "błędy {{receiver}}", "refId": "B"}
                      ]
                    },
                    {
                      "id": 8,
                      "type": "stat",
                      "title": "Konfiguracja Alertmanagera",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 23},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "alertmanager_config_last_reload_successful", "refId": "A"}]
                    },
                    {
                      "id": 10,
                      "type": "table",
                      "title": "Alerty CPU/RAM per node",
                      "gridPos": {"h": 7, "w": 24, "x": 0, "y": 31},
                      "targets": [{"expr": "ALERTS{alertname=~\"NodeCPUUsageHigh|NodeMemoryUsageHigh\", alertstate=~\"firing|pending\", instance=~\"$node\"}", "format": "table", "instant": true, "refId": "A"}]
                    }
                  ]
                }
            argo-rollouts:
              json: |
                {
                  "title": "Argo Rollouts",
                  "uid": "argo-rollouts",
                  "schemaVersion": 39,
                  "version": 1,
                  "time": {"from": "now-24h", "to": "now"},
                  "refresh": "30s",
                  "panels": [
                    {
                      "id": 1,
                      "type": "stat",
                      "title": "Kontroler Prometheus",
                      "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "min(up{job=\"argo-rollouts\"})", "refId": "A"}]
                    },
                    {
                      "id": 2,
                      "type": "stat",
                      "title": "Wersja kontrolera",
                      "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
                      "options": {"textMode": "name"},
                      "targets": [{"expr": "max(argo_rollouts_controller_info)", "legendFormat": "{{version}}", "refId": "A"}]
                    },
                    {
                      "id": 3,
                      "type": "stat",
                      "title": "Rollouty",
                      "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
                      "targets": [{"expr": "sum(rollout_info) or vector(0)", "refId": "A"}]
                    },
                    {
                      "id": 4,
                      "type": "stat",
                      "title": "Rollouty z błędem",
                      "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
                      "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                      "targets": [{"expr": "sum(rollout_info{phase=~\"Error|Timeout|Abort|InvalidSpec\"}) or vector(0)", "refId": "A"}]
                    },
                    {
                      "id": 5,
                      "type": "timeseries",
                      "title": "Rollouty według fazy",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
                      "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                      "targets": [{"expr": "sum by (phase) (rollout_info)", "legendFormat": "{{phase}}", "refId": "A"}]
                    },
                    {
                      "id": 6,
                      "type": "timeseries",
                      "title": "Dostępne i brakujące repliki",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
                      "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
                      "targets": [
                        {"expr": "rollout_info_replicas_available", "legendFormat": "dostępne {{namespace}}/{{name}}", "refId": "A"},
                        {"expr": "rollout_info_replicas_unavailable", "legendFormat": "brakujące {{namespace}}/{{name}}", "refId": "B"},
                        {"expr": "rollout_info_replicas_desired", "legendFormat": "oczekiwane {{namespace}}/{{name}}", "refId": "C"}
                      ]
                    },
                    {
                      "id": 7,
                      "type": "table",
                      "title": "Błędy reconciliacji (1h)",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
                      "targets": [{"expr": "sum by (namespace, name) (increase(rollout_reconcile_error[1h]))", "format": "table", "instant": true, "refId": "A"}]
                    },
                    {
                      "id": 8,
                      "type": "timeseries",
                      "title": "Czas reconciliacji p95",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
                      "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                      "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(rollout_reconcile_bucket[5m])))", "legendFormat": "p95", "refId": "A"}]
                    },
                    {
                      "id": 9,
                      "type": "timeseries",
                      "title": "Żądania API Kubernetes",
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
                      "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
                      "targets": [{"expr": "sum by (verb) (rate(controller_clientset_k8s_request_total[5m]))", "legendFormat": "{{verb}}", "refId": "A"}]
                    },
                    {
                      "id": 10,
                      "type": "timeseries",
                      "title": "Pamięć kontrolera",
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
                      "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
                      "targets": [{"expr": "process_resident_memory_bytes{job=\"argo-rollouts\"}", "legendFormat": "{{instance}}", "refId": "A"}]
                    }
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true