apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-local
    creationPolicy: Merge
  data:
    - secretKey: admin-user
      remoteRef:
        key: homelab/secrets
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: homelab/secrets
        property: admin-password