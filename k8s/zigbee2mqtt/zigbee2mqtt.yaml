apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: zigbee2mqtt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      nodeSelector:
        kubernetes.io/hostname: debian
      initContainers:
        - name: init-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - test -f /app/data/configuration.yaml || cp /config/configuration.yaml /app/data/configuration.yaml
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /config
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt:2.1.3
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: user
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: password
          securityContext:
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: usb
              mountPath: /dev/ttyUSB0
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: config
          configMap:
            name: zigbee2mqtt-config
        - name: usb
          hostPath:
            path: /dev/ttyUSB0
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  type: LoadBalancer
  selector:
    app: zigbee2mqtt
  ports:
    - port: 8080
      targetPort: 8080
