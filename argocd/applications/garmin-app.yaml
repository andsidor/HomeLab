apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garmin-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andsidor/HomeLab.git
    targetRevision: main
    path: k8s/garmin-app
  destination:
    server: https://kubernetes.default.svc
    namespace: garmin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
