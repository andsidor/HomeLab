apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 2.34.1
    helm:
      releaseName: kiali
      values: |
        auth:
          strategy: token
        deployment:
          service_type: LoadBalancer
          service_annotations:
            metallb.io/address-pool: lan-pool
            metallb.io/loadBalancerIPs: 192.168.0.204
        external_services:
          grafana:
            enabled: true
            internal_url: http://grafana.monitoring.svc.cluster.local:80
            external_url: http://192.168.0.200
          istio:
            root_namespace: istio-system
          prometheus:
            enabled: true
            url: http://prometheus-server.monitoring.svc.cluster.local:80
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true