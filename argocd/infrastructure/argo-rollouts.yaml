apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.12
    helm:
      values: |
        installCRDs: true
        clusterInstall: true
        controller:
          metrics:
            enabled: true
        dashboard:
          enabled: false
        providerRBAC:
          enabled: true
          providers:
            istio: false
            smi: false
            ambassador: false
            awsLoadBalancerController: false
            awsAppMesh: false
            traefik: true
            apisix: false
            contour: false
            glooPlatform: false
            gatewayAPI: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true