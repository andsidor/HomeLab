apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-install
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andsidor/HomeLab.git
    targetRevision: HEAD
    path: infrastructure/metallb/install
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      