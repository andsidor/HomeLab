apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: garmin-local-path
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-data
  namespace: garmin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: garmin-local-path
  resources:
    requests:
      storage: 5Gi