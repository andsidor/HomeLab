apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-token
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: renovate-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: homelab/secrets
        property: GIT_KEY