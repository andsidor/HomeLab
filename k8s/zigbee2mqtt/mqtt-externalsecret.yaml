apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt-credentials
  namespace: zigbee2mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mqtt-credentials
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: homelab/secrets
        property: mqtt-user
    - secretKey: password
      remoteRef:
        key: homelab/secrets
        property: mqtt-password
