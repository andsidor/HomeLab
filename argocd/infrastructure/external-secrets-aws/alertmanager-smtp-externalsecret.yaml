apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  data:
    - secretKey: smtp-auth-password
      remoteRef:
        key: homelab/secrets
        property: smtp-auth-password