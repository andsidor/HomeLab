apiVersion: batch/v1
kind: CronJob
metadata:
  name: garmin-app
  namespace: garmin
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: garmin-app
              image: ghcr.io/andsidor/homelab:latest
              args: ["--days", "9"]
              env:
                - name: HOME
                  value: /data
                - name: PROMETHEUS_PUSHGATEWAY
                  value: http://prometheus-prometheus-pushgateway.monitoring.svc.cluster.local:9091
                - name: GARMIN_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: garmin-api-token
                      key: garmin-api
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: garmin-data
