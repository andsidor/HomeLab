apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garmin-api-token
  namespace: garmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garmin-api-token
    creationPolicy: Owner
  data:
    - secretKey: garmin-personal-api-key
      remoteRef:
        key: homelab/secrets
        property: garmin-api